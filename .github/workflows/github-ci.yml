name: CI/CD Pipeline

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'

env:
  GITHUB_TOKEN: ${{ secrets.PROOF_PACKAGE_CI_TOKEN }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref_type != 'tag' && !startsWith(github.event.head_commit.message, 'WIP')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          server-id: 'github-proof'
          server-password: GITHUB_TOKEN

      - name: Compile
        run: mvn clean compile

  deploy-java:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          server-id: 'github-proof'
          server-password: GITHUB_TOKEN

      - name: Checkout CI scripts
        uses: actions/checkout@v4
        with:
          repository: kit-iai-proof/proof-ci-scripts
          path: ci-scripts
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup path for scripts
        run: echo "$GITHUB_WORKSPACE/ci-scripts" >> "$GITHUB_PATH"

      - name: Verify version
        run: ./ci-scripts/check-mvn-git-project-version-match

      - name: Login to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # Necessary because GitHub Actions does not allow to use uppercase letters in the image name, but the repository owner may contain uppercase letters.
      - name: Normalize image name
        run: |
          echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Deploy with Jib (deploy-regular execution only)
        run: mvn clean deploy -DskipTests -Djib.extra.tag=latest

  build-python-lib:
    name: Build Python library
    if: github.ref_type != 'tag' && startsWith(github.event.head_commit.message, 'Test:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Python repository
        uses: actions/checkout@v4
        with:
          repository: kit-iai-proof/proof-sim-core
          path: proof-sim-core
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build
        run: |
          python -m pip install --upgrade build

      - name: Build wheel
        working-directory: python
        run: |
          cd proof-sim-core
          python -m build --wheel

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: proof-sim-core/dist/*.whl

  build-java-python-image:
    name: Build Java + Python image
    # if: github.ref_type != 'tag' && startsWith(github.event.head_commit.message, 'Test:')
    if: false  # This job is currently disabled; enable it when needed
    runs-on: ubuntu-latest

    needs:
      - build-python-lib

    steps:
      - name: Checkout Java repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Java
        run: |
          ./mvnw clean package -DskipTests

      - name: Download Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: python-dist

      - name: Show downloaded files
        run: |
          find python-dist -type f

      - name: Build Java + Python Docker image
        run: |
          docker build \
            -f docker/Dockerfile.python \
            -t my-java-python:latest \
            .
