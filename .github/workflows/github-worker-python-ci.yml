name: worker python CI
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag for proof-worker-python'
        required: true
        type: string
      worker_base_version:
        description: 'Version of the base worker image to use'
        required: false
        type: string
        default: 'latest'

env:
  GITHUB_TOKEN: ${{ secrets.PROOF_PACKAGE_CI_TOKEN }}

jobs:
  build-sim-core:
    name: Build proof-sim-core
    runs-on: ubuntu-latest

    steps:
      - name: Checkout proof-sim-core
        uses: actions/checkout@v4
        with:
          repository: kit-iai-proof/proof-sim-core
          path: proof-sim-core
          #ref: main
          ref: reduce_whl_size
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build
        run: |
          python -m pip install --upgrade build

      - name: Build wheel
        run: |
          cd proof-sim-core
          python -m build --wheel

      - name: Upload Python wheel
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: proof-sim-core/dist/*.whl
          retention-days: 1

  deploy-worker-python:
    name: Build Java + Python image
    runs-on: ubuntu-latest
    needs: build-sim-core
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: docker/Dockerfile-worker-python

      - name: Download Python wheel
        uses: actions/download-artifact@v4
        with:
          name: python-wheel
          path: proof-sim-core/dist/

      - name: Login to GHCR
        run: echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build Java + Python Docker image
        env:
          WORKER_IMAGE: ghcr.io/kit-iai-proof/proof-worker:latest
          WORKER_PYTHON_TAG: ${{ inputs.tag }}
        run: |
          docker build \
            -f docker/Dockerfile-worker-python \
            --build-arg WORKER_IMAGE=${WORKER_IMAGE} \
            -t ghcr.io/kit-iai-proof/proof-worker-python:${WORKER_PYTHON_TAG} \
            .
          
          docker push ghcr.io/kit-iai-proof/proof-worker-python:${WORKER_PYTHON_TAG}
